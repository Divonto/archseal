name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Unit tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build
        run: go build ./cmd/archseal

      - name: Validate policy
        run: go run ./cmd/archseal doctor

      - name: Enforce architecture
        run: go run ./cmd/archseal check

      - name: Verify JSON contract
        run: go run ./cmd/archseal check --format json > /tmp/archseal.json

      - name: Verify SARIF contract
        run: go run ./cmd/archseal check --format sarif > /tmp/archseal.sarif
