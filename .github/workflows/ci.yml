name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: contract / go-${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "stable"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Unit and seed fuzz tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build
        run: go build -trimpath ./cmd/archseal

      - name: Validate policy
        run: go run ./cmd/archseal doctor

      - name: Enforce architecture
        run: go run ./cmd/archseal check

      - name: Verify JSON contract
        run: go run ./cmd/archseal check --format json > /tmp/archseal.json

      - name: Verify SARIF contract
        run: go run ./cmd/archseal check --format sarif > /tmp/archseal.sarif

  action-smoke:
    name: action / self-hosted contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Execute repository action
        uses: ./
        with:
          config: .archseal.json
          format: text

  fuzz:
    name: fuzz / import-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Fuzz import parser
        run: go test ./internal/archseal -run='^$' -fuzz=FuzzExtractImportsNeverPanics -fuzztime=5s

  reproducible-build:
    name: build / reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Build twice and compare
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /tmp/archseal-a ./cmd/archseal
          go build -trimpath -o /tmp/archseal-b ./cmd/archseal
          cmp /tmp/archseal-a /tmp/archseal-b
          sha256sum /tmp/archseal-a

  cross-build:
    name: build / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/archseal
